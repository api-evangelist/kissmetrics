gaps:
  - >-
    No first-party SDK exists for the REST Query API (query.kissmetrics.io/v3). The provider
    publishes example scripts instead — github.com/kissmetrics/example-api-scripts (Ruby, last
    push 2021-07-12), example-metrics and example-people-search (the latter marked "Deprecated"
    by the provider).
