aid: kissmetrics
name: Kissmetrics
description: >-
  Kissmetrics is a product and behavioral analytics platform that tracks individual people
  across web and mobile rather than sessions, resolving every event to a persistent identity
  and surfacing funnels, cohorts, retention, paths, revenue and A/B test reports against that
  person-level history. Product, marketing and growth teams use it to understand user journeys
  and pinpoint conversion drop-off, and it now markets an LLM Acquisition report that measures
  human traffic arriving from AI assistants. Two programmable surfaces are published: a
  Basic-auth REST Query API at query.kissmetrics.io/v3 for getting data out — account metadata,
  asynchronous ad-hoc and saved queries, SQL, and CSV/S3 exports — and a query-string tracking
  beacon at trk.kissmetrics.io for getting events in, alongside first-party Ruby, PHP, Python,
  iOS and Android libraries and a hosted JavaScript snippet.
