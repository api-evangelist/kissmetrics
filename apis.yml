apis:
  - aid: kissmetrics:rest-api
    name: Kissmetrics REST API
    description: >-
      REST API for programmatic access to Kissmetrics reports, segments, events, properties and
      account metadata. Queries are asynchronous: a POST to /queries, /queries/report or
      /queries/metric returns a query id which is polled at /queries/{id} and cancelled with a
      DELETE, and results are materialized through /exports to CSV or a customer S3 bucket. Nine
      query types are published, including cohort, funnel, ab_test, people_search and raw sql.
      Used to pull report data into dashboards, spreadsheets and BI tools, and to export user
      segments to destinations without native integrations. Authentication is HTTP Basic in the
      Authorization header. The API is self-declared beta and rate limited to 15 requests per
      minute.
    humanURL: https://support.kissmetrics.io/reference/overview-1
    baseURL: https://query.kissmetrics.io/v3
    tags:
