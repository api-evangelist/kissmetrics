note: >-
  Kissmetrics serves no /.well-known document on any host. Two hosts answer 200 on every
  /.well-known/* path and both are false positives, recorded here so a later run does not
  mistake them for a hit: www.kissmetrics.io and ai.kissmetrics.io are Next.js single-page
  apps whose catch-all route returns the HTML app shell (content-type text/html) for any
  unknown path, and trk.kissmetrics.io returns a 1x1 GIF (content-type image/gif) for every
  path by design — its own documentation states it "will respond with a 200 OK status, even if
  some of these parameters are incorrect. The response will be a 1x1 GIF image". Neither is a
  document. No WellKnown and no SecurityTxt pointer is emitted.
