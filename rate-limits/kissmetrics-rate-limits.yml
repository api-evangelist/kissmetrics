plan_differences:
  note: >-
    The pricing page markets "Extensive API access — higher limits and the full programmatic
    surface" on the paid Growth tier, but publishes no number for it. The only published figure
    is the 15/minute standard limit, described as applying to all plans. Higher limits are
    "available on request" — a sales conversation, not a documented tier.
  source: https://kissmetrics.io/pricing
gaps:
  - >-
    No rate-limit response headers of any kind. Kissmetrics publishes neither the
    X-RateLimit-* family nor the RFC 9331 RateLimit-* family nor Retry-After, so an agent cannot
    observe remaining quota or a reset time at runtime — it can only count its own calls
    against a number it read in marketing copy.
  - >-
    No limit is published for the ingest/beacon surface at trk.kissmetrics.io.
  - >-
    15 requests per minute is a hard constraint on the submit-poll query model: a single query
    consumes one call to start it plus one call per poll, so a handful of concurrent reports
    exhausts the budget.
