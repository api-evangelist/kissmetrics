notes:
  - >-
    Annual billing is a flat 20% discount on the monthly rate; prices shown on the page's slider
    are the annual basis.
  - >-
    Kissmetrics states Growth, Silver and Gold are "the identical product" — the only difference
    is price per event, which falls as volume rises. Above 5M events/month pricing is quoted
    individually.
  - >-
    API and CLI access are explicitly NOT paywalled: "The entire CLI and API are free, no
    paywall" on the Free tier; the paid tiers add "higher limits and the full programmatic
    surface" without publishing the higher limit.
