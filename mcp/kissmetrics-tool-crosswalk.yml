notes:
  - >-
    The Kissmetrics tracking/ingest surface (trk.kissmetrics.io /e, /s, /a) has no OpenAPI and no
    tool, and is deliberately excluded: it is a write-only beacon that answers 200 with a 1x1 GIF
    to everything, which makes it unsafe to expose to an agent as a verifiable tool.
