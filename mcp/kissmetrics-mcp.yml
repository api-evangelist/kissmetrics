  tools:
    - name: list_products
      rest: [fetch-products]
      description: List the products in the authorized Kissmetrics account.
    - name: list_reports
      rest: [fetch-reports]
      description: List the reports defined for a product.
    - name: list_events
      rest: [fetch-events]
      description: List the events tracked for a product.
    - name: list_properties
      rest: [fetch-properties]
      description: List the person/event properties defined for a product.
    - name: run_query
      rest: [run-query]
      description: >-
        Start an ad-hoc query — cohort, funnel, ab_test, people_search, people_count, activity,
        metric, metric_over_time or sql — and get back a query id.
    - name: run_saved_report
      rest: [v3queriesreport]
      description: Run a saved report and get back a query id.
    - name: run_saved_metric
      rest: [saved-metric-query]
      description: Run a saved metric and get back a query id.
    - name: get_query_results
      rest: [v3queriesid]
      description: Poll a started query for status and results.
    - name: cancel_query
      rest: [cancel-a-query]
      description: Cancel a running query.
    - name: create_export
      rest: [create-export]
      description: Export a completed query result to CSV or to an S3 bucket.
    - name: get_export_status
      rest: [export-status]
      description: Check the status of an export and retrieve the download link.
